<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traffic Hates You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one full-bleed canvas game, touch pad overlaid on phones. Single cartoon look, no theme switch. */
:root{--bg:#1b1612;--pad:rgba(255,255,255,.22);--padline:rgba(255,255,255,.65);--fg:#fff;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;font-family:'Baloo 2',system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch .grp{display:flex;gap:14px}
.tb{pointer-events:auto;width:74px;height:74px;border-radius:50%;background:var(--pad);border:3px solid var(--padline);color:var(--fg);font:800 26px 'Baloo 2',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.tb.on{background:rgba(255,255,255,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="grp"><div class="tb" id="bl">◀</div><div class="tb" id="br">▶</div></div>
  <div class="grp"><div class="tb" id="bj">⤒</div></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const G=440,GRAV=0.65,MAXV=6.5,WIRE_KILL=G-305,O='#2a1f1a';
const FONT="'Baloo 2',system-ui,sans-serif";
let S=1,VW=800,OY=0,TOP=0,BOT=540;
function resize(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;S=Math.min(cv.height/540,cv.width/700);VW=cv.width/S;OY=(cv.height-540*S)/2;TOP=-OY/S;BOT=540+OY/S}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f1,f2,d,type='square',v=0.12,delay=0){if(!AC)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+0.03)}
const SFX={
 jump:()=>tone(380,720,0.12,'square',0.08),
 die:()=>{tone(420,50,0.7,'sawtooth',0.16);tone(300,40,0.7,'square',0.08,0.05)},
 honk:()=>{tone(430,420,0.16,'sawtooth',0.1);tone(430,420,0.28,'sawtooth',0.1,0.2)},
 bark:()=>{tone(720,280,0.09,'square',0.12);tone(720,280,0.09,'square',0.12,0.16)},
 creak:()=>tone(150,70,0.55,'triangle',0.2),
 thud:()=>tone(130,35,0.35,'sine',0.4),
 crack:()=>tone(220,40,0.3,'sawtooth',0.15),
 ding:()=>tone(880,880,0.14,'sine',0.14),
 geyser:()=>tone(150,900,0.45,'sawtooth',0.1),
 zap:()=>{for(let i=0;i<7;i++)tone(90+i*50,60,0.05,'square',0.16,i*0.05)},
 whistle:()=>{tone(2200,2100,0.12,'sine',0.1);tone(2200,2300,0.3,'sine',0.1,0.15)},
 win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,0.16,'square',0.09,i*0.1)),
 hehe:()=>{tone(900,1300,0.08,'square',0.08);tone(900,1300,0.08,'square',0.08,0.13)}
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}

/* ---------- input ---------- */
const keys={},touch={l:false,r:false};let jumpBuf=0;
const JUMPK=['Space','ArrowUp','KeyW'];
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
 initAudio();
 if(e.repeat)return;
 keys[e.code]=true;
 if(JUMPK.includes(e.code)&&state==='play')jumpBuf=8;
 if(e.code==='KeyR'&&state==='play'){loadLevel(lvIdx);return}
 anyKey();
});
addEventListener('keyup',e=>{keys[e.code]=false});
const right=()=>keys.ArrowRight||keys.KeyD||touch.r,left=()=>keys.ArrowLeft||keys.KeyA||touch.l;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
if(isTouch)document.getElementById('touch').style.display='flex';
function bindBtn(id,on,off){const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();el.classList.add('on');on()});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{el.classList.remove('on');off&&off()}))}
bindBtn('bl',()=>touch.l=true,()=>touch.l=false);
bindBtn('br',()=>touch.r=true,()=>touch.r=false);
bindBtn('bj',()=>{if(state==='play')jumpBuf=8;else anyKey()});
cv.addEventListener('pointerdown',()=>{initAudio();anyKey()});

/* ---------- helpers ---------- */
function hash(n){n=(n<<13)^n;return((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function pbox(){return{x:p.x-22,y:p.y-56,w:44,h:54}}
function font(sz){return`800 ${sz}px ${FONT}`}
function oText(s,x,y,sz,fill='#fff',align='center'){ctx.font=font(sz);ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(4,sz/4.5);ctx.strokeStyle=O;ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y)}
function bubble(s,x,y,sz=16){ctx.font=font(sz);const w=ctx.measureText(s).width+22,h=sz+16;ctx.lineWidth=3;ctx.strokeStyle=O;ctx.fillStyle='#fff';
 ctx.beginPath();ctx.moveTo(x-7,y-h+2);ctx.lineTo(x,y+10);ctx.lineTo(x+7,y-h+2);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.roundRect(x-w/2,y-h*2+2,w,h,12);ctx.fill();ctx.stroke();
 ctx.fillRect(x-5,y-h-2,10,6);
 ctx.fillStyle=O;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y-h*1.5+3)}
function wrap(s,maxW,sz){ctx.font=font(sz);const out=[];let line='';for(const w of s.split(' ')){const tr=line?line+' '+w:w;if(ctx.measureText(tr).width>maxW&&line){out.push(line);line=w}else line=tr}if(line)out.push(line);return out}
function burst(x,y,n,col,spd=5,sz=5,grav=0.4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*spd;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.4,life:40+Math.random()*30,col,sz:sz*(0.5+Math.random()),g:grav})}}

/* ---------- death messages ---------- */
const M={
 fall:['Rơi xuống ổ gà. Sâu hơn bạn tưởng.','Ổ gà này có từ năm 2009, chưa ai vá.','Ổ gà tàng hình. Đường vừa trải nhựa tuần trước.'],
 dog:'Chó nhà ai không xích. Chủ: "Nó hiền lắm mà!"',
 zap:'Nắp cống bắn bạn lên dây điện. Tóc dựng đứng luôn.',
 light:'CSGT: "Vượt đèn đỏ! Phạt 4–6 triệu, trừ 4 điểm bằng lái."',
 onc:'Xe đi ngược chiều, còn bóp còi bắt bạn tránh.',
 pole:'Cột điện đổ. Điện lực xin lỗi vì sự bất tiện này.',
 bus:'Xe buýt không nhường ai. Chưa bao giờ.',
 flood:'Chết máy giữa biển nước. Dắt bộ về thôi.',
 gate:'Đâm vào cổng công ty. Bảo vệ: "Nói rồi mà!"'
};
const HEAD=['TOANG!','CHỊU!','ÔI THÔI XONG','ẢO THẬT ĐẤY','TRỄ LÀM RỒI','CẠN LỜI'];

/* ---------- entities ---------- */
function Txt(x,y,s,o={}){return{x,y,s,sz:o.size||22,col:o.color||'#fff',draw(){oText(this.s,this.x,this.y,this.sz,this.col)}}}

function cone(x){ctx.fillStyle='#ff7b25';ctx.strokeStyle=O;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-12,G+2);ctx.lineTo(x,G-34);ctx.lineTo(x+12,G+2);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(x-6,G-19,12,5)}

function Hole(x,w,o={}){return{k:'hole',x,w,open:!o.hidden,hidden:!!o.hidden,trig:o.trigger,sign:o.sign,
 update(){if(!this.open&&p.x>this.trig){this.open=true;sfx('crack');shake=7;for(let i=0;i<14;i++)burst(this.x+Math.random()*this.w,G+4,1,'#6b6a75',4,7)}},
 draw(){
  if(this.open){ctx.fillStyle='#17110d';ctx.fillRect(this.x,G,this.w,BOT-G+10);
   ctx.fillStyle='#7a5434';ctx.fillRect(this.x,G,7,BOT-G+10);ctx.fillRect(this.x+this.w-7,G,7,BOT-G+10);
   ctx.strokeStyle=O;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(this.x,G);for(let i=0;i<=6;i++)ctx.lineTo(this.x+this.w*i/6,G+(i%2?7:2));ctx.stroke()}
  else if(this.hidden){ctx.strokeStyle='rgba(30,25,25,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(this.x+12,G+10);ctx.lineTo(this.x+30,G+16);ctx.lineTo(this.x+44,G+9);ctx.lineTo(this.x+60,G+15);ctx.stroke()}
  if(this.sign){cone(this.x-20);cone(this.x+this.w+20)}
 }}}

function drawCop(x,alert){
 ctx.strokeStyle=O;ctx.lineWidth=3;
 ctx.fillStyle='#3d5a40';ctx.fillRect(x-10,G-34,8,34);ctx.strokeRect(x-10,G-34,8,34);ctx.fillRect(x+2,G-34,8,34);ctx.strokeRect(x+2,G-34,8,34);
 ctx.fillStyle='#e9c46a';ctx.beginPath();ctx.roundRect(x-14,G-72,28,40,6);ctx.fill();ctx.stroke();
 ctx.fillStyle='#f2c29b';ctx.beginPath();ctx.arc(x,G-84,11,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#e9c46a';ctx.beginPath();ctx.roundRect(x-14,G-100,28,10,4);ctx.fill();ctx.stroke();ctx.fillStyle='#c0392b';ctx.fillRect(x-12,G-93,24,3);
 ctx.fillStyle=O;ctx.beginPath();ctx.arc(x-4,G-84,1.8,0,7);ctx.fill();
 ctx.lineWidth=5;ctx.strokeStyle=O;ctx.beginPath();
 if(alert){ctx.moveTo(x-12,G-66);ctx.lineTo(x-28,G-92);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-28,G-92);ctx.lineTo(x-40,G-118);ctx.stroke();ctx.strokeStyle='#e63946';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(x-28,G-92);ctx.lineTo(x-40,G-118);ctx.stroke();ctx.setLineDash([])}
 else{ctx.moveTo(x-12,G-66);ctx.lineTo(x-16,G-42);ctx.stroke()}
}

function Light(x,o={}){return{k:'light',x,st:'idle',t:0,fickle:!!o.fickle,trig:o.trig||280,caught:false,
 update(dt){
  if(this.st==='idle'&&p.x>this.x-this.trig){this.st='red';this.t=0;sfx('ding')}
  if(this.st==='red'){
   if(state==='play'&&p.x+24>this.x&&p.x<this.x+110){this.caught=true;sfx('whistle');die(M.light)}
   if(Math.abs(p.vx)<0.35&&p.x<this.x)this.t+=dt;
   if(this.t>110){this.t=0;if(this.fickle){this.st='fake';this.fickle=false}else this.st='done';sfx('ding')}
  }else if(this.st==='fake'){this.t+=dt;if(this.t>22){this.st='red';this.t=0;sfx('ding')}}
 },
 draw(){const x=this.x,px=x+22,red=this.st==='red',green=!red;
  ctx.fillStyle='#f5f5f5';ctx.fillRect(x-6,G+3,6,46);
  for(let i=0;i<4;i++)ctx.fillRect(x+16+i*22,G+3,12,46);
  ctx.strokeStyle=O;ctx.lineWidth=3;ctx.fillStyle='#59606b';ctx.fillRect(px-4,G-220,8,220);ctx.strokeRect(px-4,G-220,8,220);
  ctx.fillStyle='#222';ctx.beginPath();ctx.roundRect(px-17,G-306,34,90,8);ctx.fill();ctx.stroke();
  const L=[[G-286,'#ff3b30',red],[G-261,'#ffcc00',false],[G-236,'#34c759',green]];
  for(const[y,c,on]of L){ctx.fillStyle=on?c:'#3a3a3a';ctx.beginPath();ctx.arc(px,y,9,0,7);ctx.fill();if(on){ctx.fillStyle=c+'55';ctx.beginPath();ctx.arc(px,y,16,0,7);ctx.fill()}}
  ctx.fillStyle='#111';ctx.beginPath();ctx.roundRect(px+20,G-298,44,32,5);ctx.fill();ctx.stroke();
  let n=this.st==='idle'?'12':this.st==='red'?String(Math.max(1,Math.ceil((110-this.t)/22))):this.st==='fake'?'0':'--';
  ctx.font=font(22);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=red?'#ff3b30':'#34c759';ctx.fillText(n,px+42,G-281);
  drawCop(x+130,this.caught);
  if(this.caught)bubble('TẤP VÀO!',x+130,G-128,16);
  else if(red&&Math.abs(p.vx)>0.35&&p.x>this.x-260)bubble('Dừng hẳn lại!',x+130,G-128,14);
 }}}

function drawBike(dir,rot,c){
 ctx.save();ctx.scale(dir,1);ctx.strokeStyle=O;ctx.lineJoin='round';ctx.lineCap='round';
 for(const wx of[-22,22]){ctx.lineWidth=3;ctx.fillStyle='#2b2b30';ctx.beginPath();ctx.arc(wx,-13,13,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#cfd3da';ctx.beginPath();ctx.arc(wx,-13,6,0,7);ctx.fill();
  ctx.save();ctx.translate(wx,-13);ctx.rotate(rot);ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.stroke();ctx.restore()}
 ctx.lineWidth=3;ctx.strokeStyle=O;
 ctx.beginPath();ctx.moveTo(22,-13);ctx.lineTo(17,-46);ctx.stroke();
 ctx.fillStyle=c.body;ctx.beginPath();ctx.moveTo(-36,-24);ctx.quadraticCurveTo(-32,-40,-12,-37);ctx.lineTo(6,-30);ctx.lineTo(16,-44);ctx.lineTo(28,-41);ctx.lineTo(25,-22);ctx.quadraticCurveTo(0,-14,-22,-20);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#222';ctx.beginPath();ctx.roundRect(-30,-44,30,8,4);ctx.fill();ctx.stroke();
 ctx.fillStyle='#ffe680';ctx.beginPath();ctx.arc(27,-37,4,0,7);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(12,-51);ctx.lineTo(24,-49);ctx.stroke();
 const lean=c.lean||0;
 ctx.save();ctx.translate(-12,-44);ctx.rotate(lean);
 // leg
 ctx.lineWidth=10;ctx.strokeStyle=O;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,8);ctx.lineTo(16,22);ctx.stroke();
 ctx.lineWidth=5;ctx.strokeStyle=c.pants;ctx.stroke();
 // torso
 ctx.lineWidth=17;ctx.strokeStyle=O;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,-24);ctx.stroke();
 ctx.lineWidth=12;ctx.strokeStyle=c.jacket;ctx.stroke();
 // arm
 ctx.lineWidth=9;ctx.strokeStyle=O;ctx.beginPath();ctx.moveTo(8,-22);ctx.lineTo(26,-8);ctx.stroke();
 ctx.lineWidth=5;ctx.strokeStyle=c.jacket;ctx.stroke();
 // head
 ctx.lineWidth=3;ctx.strokeStyle=O;ctx.fillStyle='#f2c29b';ctx.beginPath();ctx.arc(12,-37,11,0,7);ctx.fill();ctx.stroke();
 if(c.mask){ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(12,-35,12,9,3);ctx.fill();ctx.stroke()}
 ctx.fillStyle=O;ctx.beginPath();ctx.arc(17,-40,1.9,0,7);ctx.fill();
 ctx.fillStyle=c.helmet;ctx.beginPath();ctx.arc(11,-39,13,Math.PI*1.02,Math.PI*1.98);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(18,-48);ctx.lineTo(27,-44);ctx.stroke();
 ctx.restore();
 ctx.restore();
}

function Oncoming(trig,o={}){return{k:'onc',trig,on:false,x:0,sp:o.speed||8,t:0,
 update(dt){if(!this.on){if(p.x>this.trig){this.on=true;this.x=cam+VW+80;sfx('honk')}return}
  this.t+=dt;this.x-=this.sp*dt;
  if(state==='play'&&overlap(pbox(),{x:this.x-26,y:G-54,w:52,h:54}))die(M.onc)},
 draw(){if(!this.on)return;ctx.save();ctx.translate(this.x,G);drawBike(-1,-this.t*0.6,{body:'#2a9d8f',helmet:'#e63946',jacket:'#6a4c93',pants:'#333'});ctx.restore();
  if(this.t<70)bubble('TRÁNH RA!',this.x,G-100,15)}}}

function Pole(x,dir,trig,o={}){return{k:'pole',x,dir,trig,a:0,av:0,st:0,len:o.len||240,acc:o.acc||0.004,wob:o.wobble??10,
 update(dt){
  if(this.st===0){if(p.x>this.trig){this.st=1;sfx('creak')}return}
  if(this.st===1){this.wob-=dt;if(this.wob>0)return;
   this.av+=this.acc*dt;this.a+=this.av*dt;
   if(Math.random()<0.5)particles.push({x:this.x+this.dir*Math.sin(this.a)*this.len*0.8,y:G-Math.cos(this.a)*this.len*0.8,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:20,col:'#ffe14d',sz:4,g:0.2});
   if(state==='play'){const b=pbox();for(let i=0.12;i<=1;i+=0.04){const qx=this.x+this.dir*Math.sin(this.a)*this.len*i,qy=G-Math.cos(this.a)*this.len*i;if(qx>b.x+4&&qx<b.x+b.w-4&&qy>b.y+6&&qy<b.y+b.h){die(M.pole);break}}}
   if(this.a>=Math.PI/2){this.a=Math.PI/2;this.st=2;shake=12;sfx('thud');for(let i=0;i<10;i++)burst(this.x+this.dir*this.len*Math.random(),G-6,1,'#b9a68a',4,7)}
  }},
 draw(){const wob=this.st===1&&this.wob>0?Math.sin(t*1.6)*0.05:0;
  ctx.save();ctx.translate(this.x,G-2);ctx.rotate(this.dir*this.a+wob);ctx.strokeStyle=O;ctx.lineWidth=3;
  const L=this.len;ctx.fillStyle='#a3a7ad';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-5,-L);ctx.lineTo(5,-L);ctx.lineTo(8,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#6d5a4a';ctx.fillRect(-30,-L+14,60,6);ctx.strokeRect(-30,-L+14,60,6);
  for(const ix of[-24,-8,8,24]){ctx.fillStyle='#e8e2d0';ctx.fillRect(ix-3,-L+4,6,10)}
  ctx.fillStyle='#6b7b8c';ctx.beginPath();ctx.roundRect(5,-L*0.62,24,34,4);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#1d1d1d';ctx.lineWidth=2;for(let i=0;i<9;i++){ctx.beginPath();ctx.ellipse(0,-L*0.78,14+i,7+((i*3)%5),i*0.4,0,7);ctx.stroke()}
  ctx.restore()}}}

function Manhole(x){return{k:'man',x,st:0,t:0,
 update(dt){if(this.st===0&&state==='play'&&p.onGround&&!p.ride&&Math.abs(p.x-this.x)<24){this.st=1;p.vy=-25;p.onGround=false;sfx('geyser');shake=8}if(this.st===1)this.t+=dt},
 draw(){const x=this.x;ctx.strokeStyle=O;ctx.lineWidth=3;
  if(this.st===0){ctx.fillStyle='#55555e';ctx.beginPath();ctx.roundRect(x-26,G-3,52,8,3);ctx.fill();ctx.stroke();ctx.fillStyle='#3a3a40';for(const bx of[-16,0,16])ctx.fillRect(x+bx-2,G-1,4,3);return}
  ctx.fillStyle='#1a1410';ctx.fillRect(x-24,G,48,8);
  const hgt=Math.min(420,this.t*30)*Math.max(0,1-Math.max(0,this.t-50)/40);
  if(hgt>2){ctx.fillStyle='rgba(120,200,255,.85)';ctx.beginPath();ctx.moveTo(x-16,G);ctx.quadraticCurveTo(x-10+Math.sin(t)*4,G-hgt/2,x-6,G-hgt);ctx.lineTo(x+6,G-hgt);ctx.quadraticCurveTo(x+10,G-hgt/2,x+16,G);ctx.fill();ctx.stroke();
   for(let i=0;i<3;i++){ctx.fillStyle='#e9f7ff';ctx.beginPath();ctx.arc(x+(i-1)*9,G-hgt+Math.sin(t*0.5+i)*3,7,0,7);ctx.fill()}}
  const cy=G-Math.min(520,this.t*16);ctx.save();ctx.translate(x+this.t*1.5,cy);ctx.rotate(this.t*0.3);ctx.fillStyle='#55555e';ctx.beginPath();ctx.roundRect(-26,-4,52,8,3);ctx.fill();ctx.stroke();ctx.restore()}}}

function Dog(trig,x){return{k:'dog',trig,x,on:false,t:0,
 update(dt){if(!this.on){if(p.x>this.trig){this.on=true;sfx('bark')}return}this.t+=dt;if(this.t>22)this.x-=5.6*dt;
  if(state==='play'&&overlap(pbox(),{x:this.x-20,y:G-30,w:40,h:30}))die(M.dog)},
 draw(){const x=this.x;ctx.strokeStyle=O;ctx.lineWidth=3;

 drawWires();drawRoad();
 for(const e of lv.ents)if(e.k!=='txt')e.draw&&e.draw();
 if(state!=='title')drawPlayer();
 for(const e of lv.ents)e.drawFront&&e.drawFront();
 for(const q of particles){ctx.fillStyle=q.col;ctx.globalAlpha=Math.min(1,q.life/20);ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz)}ctx.globalAlpha=1;
 ctx.restore();
 ctx.setTransform(S,0,0,S,0,OY);
 hud();
}
function clock(){const m=30+deaths*2,h=7+Math.floor(m/60);return`${h}:${String(m%60).padStart(2,'0')}`}
function dim(a){ctx.fillStyle=`rgba(20,14,10,${a})`;ctx.fillRect(0,TOP,VW,BOT-TOP)}
function hud(){
 const cx=VW/2;
 if(state==='title'){dim(0.55);
  oText('TRAFFIC',cx,150,Math.min(96,VW/7),'#ffd23f');oText('HATES YOU',cx,230,Math.min(96,VW/7),'#ff5a5a');
  oText('bản Sài Gòn',cx,292,26,'#fff');
  oText('Nhiệm vụ: chạy xe máy tới công ty trước 8:00.',cx,350,20,'#cfeaf7');
  oText(isTouch?'◀ ▶ chạy / phanh   ⤒ nhảy':'→ chạy   ← phanh   SPACE nhảy   R chơi lại màn',cx,388,18,'#fff');
  if((t|0)%60<40)oText(isTouch?'CHẠM ĐỂ BẮT ĐẦU':'NHẤN PHÍM BẤT KỲ',cx,450,30,'#ffd23f');return}
 if(state==='end'){endT+=1;dim(0.8);
  const late=30+deaths*2-60;
  oText('Tới công ty lúc '+clock()+'!',cx,130,Math.min(46,VW/14),'#ffd23f');
  oText(late>0?`(trễ ${late} phút...)`:'Đúng giờ! Siêu nhân!',cx,180,22,'#fff');
  if(endT>70)oText('...nhưng hôm nay là CHỦ NHẬT 🙃',cx,260,Math.min(40,VW/16),'#ff5a5a');
  if(endT>110){oText(`💀 Tổng số lần chết: ${deaths}`,cx,330,28,'#fff');oText('Chụp màn hình thách bạn bè làm ít hơn!',cx,372,18,'#cfeaf7')}
  if(endT>150&&(t|0)%60<40)oText(isTouch?'Chạm để chơi lại':'Nhấn phím để chơi lại',cx,440,22,'#ffd23f');return}
 ctx.font=font(20);
 oText(lv.name,16,30,22,'#fff','left');
 oText(`💀 ${deaths}`,16,62,22,'#ffd23f','left');
 oText(`🕗 ${clock()}`,VW-16,30,22,deaths>=15?'#ff5a5a':'#fff','right');
 if(state==='dead'&&deadT>18){const a=Math.min(1,(deadT-18)/12);ctx.globalAlpha=a;dim(0.6);
  oText(deathHead,cx,170,Math.min(80,VW/9),'#ff5a5a');
  const lines=wrap(deathMsg,Math.min(620,VW-40),24);lines.forEach((l,i)=>oText(l,cx,250+i*34,24,'#fff'));
  oText(`Lần chết thứ ${deaths}  ·  đồng hồ +2 phút`,cx,250+lines.length*34+20,18,'#ffd23f');
  if(deadT>22)oText(isTouch?'Chạm để thử lại':'Nhấn phím bất kỳ để thử lại',cx,420,22,'#cfeaf7');
  ctx.globalAlpha=1}
 if(state==='clear'){const a=Math.min(1,clearT/15);ctx.globalAlpha=a;
  oText('QUA MÀN!',cx,180,Math.min(80,VW/9),'#34c759');
  oText(levelDeaths?`Màn này chết ${levelDeaths} lần`:'Không chết lần nào?! Nghi lắm...',cx,250,24,'#fff');
  ctx.globalAlpha=1}
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(2.5,(now-last)/16.667);last=now;t+=dt;
 if(state==='play'||state==='dead'||state==='clear')update(dt);
 render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__thy={get p(){return p},get state(){return state},keys,load:loadLevel};
})();
</script>
